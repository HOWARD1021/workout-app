#:schema node_modules/wrangler/config-schema.json

name = "workout-app"
# Account that owns workout-app / workout-db / the louvrerobbery.uk zone.
# Pinned so `wrangler deploy` picks the right account non-interactively
# (the auth token can see more than one account).
account_id = "63198f63d50664023e78af2d617cea07"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
main = ".open-next/worker.js"

# Assets configuration
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "workout-db"
database_id = "94c0f610-8616-4105-9d25-93ffcdb13d3c"
